name: Deploy til nordlysco.dk (FTPS)

# Køres KUN manuelt - aldrig automatisk ved push. Du (eller Arena på din kommando)
# trykker "Run workflow" i GitHub, eller jeg kører den via `gh workflow run`.
#
# FAST REGEL (fra logbogen, skal efterleves 100% hver gang):
#   Alle filer i alle afkroge og hjørner af serveren skal tjekkes før og efter
#   hver upload. Derfor har denne robot ALTID tre trin i rækkefølge:
#     1) REVISION  - fuld filliste af HELE /public_html/ (alle mapper, ikke kun
#        dem vi rører), gemt som artifact, FØR noget som helst uploades.
#     2) BACKUP    - de konkrete filer, der er ved at blive overskrevet, hentes
#        ned og gemmes som artifact, FØR de overskrives.
#     3) DEPLOY    - selve uploaden, kun ændrede filer, intet slettes.
#   Efter kørsel ligger REVISION- og BACKUP-artifacts klar til download i 90
#   dage under "Actions" -> det pågældende run -> "Artifacts".

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Skriv JA for at bekræfte upload til LIVE nordlysco.dk'
        required: true
        default: 'NEJ'

jobs:
  revision_og_backup:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'JA' }}
    permissions:
      contents: write
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: "0) Tjek at FTP-secrets rent faktisk er sat (uden at afsløre værdierne)"
        env:
          FTP_USER: ${{ secrets.NORDLYSCO_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.NORDLYSCO_FTP_PASSWORD }}
        run: |
          fail=0
          if [ -z "$FTP_USER" ]; then
            echo "::error::Secret NORDLYSCO_FTP_USERNAME er TOM eller mangler helt (tjek at den er en Repository secret under Settings -> Secrets and variables -> Actions, IKKE under Agents secrets eller et Environment)."
            fail=1
          fi
          if [ -z "$FTP_PASS" ]; then
            echo "::error::Secret NORDLYSCO_FTP_PASSWORD er TOM eller mangler helt (tjek at den er en Repository secret under Settings -> Secrets and variables -> Actions, IKKE under Agents secrets eller et Environment)."
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "Begge secrets er til stede (længder: bruger=${#FTP_USER} tegn, adgangskode=${#FTP_PASS} tegn)."

      - name: "1) REVISION: fuld filliste af HELE /public_html/ (alle afkroge og hjørner)"
        env:
          FTP_HOST: ftp.simply.com
          FTP_USER: ${{ secrets.NORDLYSCO_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.NORDLYSCO_FTP_PASSWORD }}
        run: |
          set +e
          mkdir -p revision
          OUTFILE="revision/server-revision-$(date +%Y-%m-%d_%H%M).txt"
          : > curl-revision-err.txt

          echo "=== Forsøg A: rekursiv filliste i én kommando (LIST -R) ==="
          curl -s --connect-timeout 20 --ftp-ssl --insecure -u "$FTP_USER:$FTP_PASS" \
            -X "LIST -R" "ftp://$FTP_HOST:21/public_html/" > "$OUTFILE" 2>>curl-revision-err.txt
          status_a=$?
          lines=$(wc -l < "$OUTFILE" 2>/dev/null | tr -d ' ')
          echo "LIST -R exit-kode: $status_a, linjer fundet: $lines"

          if [ "$status_a" -ne 0 ] || [ -z "$lines" ] || [ "$lines" -lt 1 ]; then
            echo ""
            echo "=== Forsøg A gav intet brugbart - forsøg B: manuel rekursiv crawl med MLSD (RFC 3659) ==="
            : > "$OUTFILE"
            crawl() {
              local dir="$1"
              local listing
              listing=$(curl -s --connect-timeout 20 --ftp-ssl --insecure -u "$FTP_USER:$FTP_PASS" \
                -X MLSD "ftp://$FTP_HOST:21${dir}/" 2>>curl-revision-err.txt)
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                entry_type=$(echo "$line" | grep -oE 'type=[A-Za-z]+' | head -1 | cut -d= -f2)
                name=$(echo "$line" | sed -E 's/^[^ ]*; //')
                [ -z "$name" ] && continue
                case "$entry_type" in
                  file)
                    echo "FILE ${dir}/${name}" >> "$OUTFILE"
                    ;;
                  dir)
                    echo "DIR  ${dir}/${name}" >> "$OUTFILE"
                    crawl "${dir}/${name}"
                    ;;
                esac
              done <<< "$listing"
            }
            crawl "/public_html"
          fi

          lines=$(wc -l < "$OUTFILE" 2>/dev/null | tr -d ' ')
          echo "Antal linjer i fillisten: $lines"
          echo "--- evt. fejl undervejs ---"
          cat curl-revision-err.txt
          if [ -z "$lines" ] || [ "$lines" -lt 1 ]; then
            echo "::error::Kunne ikke lave nogen filliste af serveren (hverken LIST -R eller MLSD-crawl virkede). Se curl-revision-err.txt i ci-ftp-debug-grenen for detaljer."
            exit 1
          fi
          echo "Revision gemt: $OUTFILE"
          wc -l "$OUTFILE"

      - name: "Debug: commit fuldt curl/ftp-output til ci-ftp-debug-grenen (altid, uanset success/fejl)"
        if: always()
        run: |
          mkdir -p /tmp/ftp-debug-dump
          rm -f /tmp/ftp-debug-dump/seneste.txt
          for f in curl-revision-err.txt revision/*.txt backup-trin2-output.txt; do
            if [ -f "$f" ]; then
              echo "=== $f ===" >> /tmp/ftp-debug-dump/seneste.txt
              cat "$f" >> /tmp/ftp-debug-dump/seneste.txt
              echo "" >> /tmp/ftp-debug-dump/seneste.txt
            fi
          done
          if [ ! -f /tmp/ftp-debug-dump/seneste.txt ]; then
            echo "(ingen debug-filer fundet - intet at committe)" > /tmp/ftp-debug-dump/seneste.txt
          fi
          # Arbejd i en helt separat, frisk clone i /tmp, så vi IKKE rører
          # hovedarbejdsmappen (nordlysco-deploy/ skal bruges af senere trin).
          rm -rf /tmp/debug-push-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" /tmp/debug-push-repo
          cd /tmp/debug-push-repo
          git config user.name "nordlysco-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-ftp-debug-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/ftp-debug-dump/seneste.txt ./seneste-ftp-debug.txt
          echo "Køre-ID: ${{ github.run_id }} - $(date -u)" > ./info.txt
          git add seneste-ftp-debug.txt info.txt
          git commit -m "FTP-debug fra run ${{ github.run_id }}"
          git push origin HEAD:ci-ftp-debug --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "2) BACKUP: hent de filer ned, som er ved at blive overskrevet"
        env:
          FTP_HOST: ftp.simply.com
          FTP_USER: ${{ secrets.NORDLYSCO_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.NORDLYSCO_FTP_PASSWORD }}
        run: |
          set +e
          mkdir -p backup-foer-upload
          cd nordlysco-deploy
          # Byg en liste over præcis de relative stier, vi er ved at overskrive.
          find . -type f | sed 's|^\./||' > ../filer-der-overskrives.txt
          cat ../filer-der-overskrives.txt
          cd ..
          : > backup-trin2-output.txt
          while IFS= read -r fil; do
            [ -z "$fil" ] && continue
            mkdir -p "backup-foer-upload/$(dirname "$fil")"
            curl -s --connect-timeout 20 --ftp-ssl --insecure -u "$FTP_USER:$FTP_PASS" \
              "ftp://$FTP_HOST:21/public_html/$fil" \
              -o "backup-foer-upload/$fil" 2>>backup-trin2-output.txt
            if [ $? -ne 0 ] || [ ! -s "backup-foer-upload/$fil" ]; then
              echo "(fandtes ikke på serveren endnu, eller kunne ikke hentes: $fil)" | tee -a backup-trin2-output.txt
              rm -f "backup-foer-upload/$fil"
            else
              echo "Backup OK: $fil" | tee -a backup-trin2-output.txt
            fi
          done < filer-der-overskrives.txt

      - name: Gem revision + backup som artifacts (tilgængelige i 90 dage)
        uses: actions/upload-artifact@v4
        with:
          name: revision-og-backup-${{ github.run_id }}
          path: |
            revision/
            backup-foer-upload/
          retention-days: 90

  deploy:
    needs: revision_og_backup
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'JA' }}
    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: "3) DEPLOY: upload filer via curl/FTPS til Simply.com"
        # Simply.coms FTP er en FTP-proxy ("FTP proxy ready (passive mode
        # required)"), som både lftp og SamKirkland/FTP-Deploy-Action
        # (node-biblioteket basic-ftp) fejler imod ("find: Not connected"
        # hhv. "Server sent FIN packet unexpectedly"). curl er den eneste
        # klient, der har vist sig at virke pålideligt mod denne proxy
        # (bekræftet i REVISION-trinnet ovenfor), så selve uploaden bruger
        # også curl. --ftp-create-dirs opretter mapper på serveren efter
        # behov. Mappen ./nordlysco-deploy/ er lille (få titals filer), så
        # alt uploades hver gang - ingen slettes, intet andet røres.
        env:
          FTP_HOST: ftp.simply.com
          FTP_USER: ${{ secrets.NORDLYSCO_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.NORDLYSCO_FTP_PASSWORD }}
        run: |
          set +e
          cd nordlysco-deploy
          find . -type f | sed 's|^\./||' > ../filer-der-uploades.txt
          cd ..
          echo "=== Filer der uploades ==="
          cat filer-der-uploades.txt

          fail=0
          : > curl-deploy-output.txt
          while IFS= read -r fil; do
            [ -z "$fil" ] && continue
            echo "Uploader: $fil"
            curl -s --connect-timeout 20 --ftp-ssl --insecure --ftp-create-dirs \
              -u "$FTP_USER:$FTP_PASS" \
              -T "nordlysco-deploy/$fil" \
              "ftp://$FTP_HOST:21/public_html/$fil" >> curl-deploy-output.txt 2>&1
            status=$?
            if [ $status -ne 0 ]; then
              echo "FEJL ved upload af $fil (curl exit-kode $status)" | tee -a curl-deploy-output.txt
              fail=1
            fi
          done < filer-der-uploades.txt

          echo ""
          echo "=== curl-output ==="
          cat curl-deploy-output.txt

          if [ "$fail" -ne 0 ]; then
            echo "::error::En eller flere filer kunne ikke uploades til $FTP_HOST. Se curl-deploy-output.txt ovenfor."
            exit 1
          fi
          echo "Alle filer uploadet succesfuldt."

      - name: Verificér efter upload (http-status på de nye/ændrede sider)
        run: |
          for url in \
            "https://nordlysco.dk/articles/hertil-og-ikke-laengere.html" \
            "https://nordlysco.dk/assets/img/hertil-2026/imperiets-storhedstid-og-nedfald.jpg" \
            "https://nordlysco.dk/assets/img/hertil-2026/hertil-og-ikke-laengere-delekort-1200x630.jpg" \
            "https://nordlysco.dk/articles/bag-pigtraaden-gaza-whistleblowere-2026.html" \
            "https://nordlysco.dk/assets/img/gaza-whistleblowere-2026/jabalia-destruction.jpg" \
            "https://nordlysco.dk/assets/js/meta-artikler.js" \
            "https://nordlysco.dk/rss.xml" \
            "https://nordlysco.dk/sitemap.xml" \
            "https://nordlysco.dk/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$code  $url"
          done
